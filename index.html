<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography App</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f7f7f9;color:#111318}
#boot{padding:24px;text-align:center;color:#667085}
</style>
</head>
<body>
<div id="boot">Loading Photography App…</div>
<script>
(function(){
  fetch('app-core.html?v=432',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Could not load app');return r.text();})
    .then(function(html){
      var injection='<script src="auto-iso-layout.js?v=440"><\/script>';
      if(html.indexOf('</body>')>=0) html=html.replace('</body>',injection+'</body>');
      else html+=injection;
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.getElementById('boot').textContent='Could not load Photography App. Refresh the page.';
      console.error(err);
    });
})();
</script>
</body>
</html>
