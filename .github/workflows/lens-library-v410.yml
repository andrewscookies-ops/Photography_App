          s,n1=re.subn(r'var lensesBuiltin=\[.*?\n\];',film_lenses,s,count=1,flags=re.S)
          if n1!=1: raise SystemExit(f'film lens block replacements: {n1}')
          s,n2=re.subn(r'var lensesDigitalBuiltin=\[.*?\n\];',digital_lenses,s,count=1,flags=re.S)
          if n2!=1: raise SystemExit(f'digital lens block replacements: {n2}')
          s=s.replace('Version 4.0.9 — September 2026','Version 4.1.0 — September 2026',1)

          # sanity: every supported mount gets a substantial list
          mounts=['nikon_f','canon_fd','pentax_k','minolta_sr','olympus_om','sony_e','canon_rf','nikon_z','fujifilm_x','l_mount','canon_eos']
          counts={m:s.count('mount:"'+m+'"') for m in mounts}
          too_small={m:c for m,c in counts.items() if c<14}
          if too_small: raise SystemExit('Lens coverage too small: '+repr(too_small))
          if 'Version 4.1.0' not in s: raise SystemExit('Version bump missing')
          path.write_text(s,encoding='utf-8')
          print('Lens counts:',counts)
          PY

      - name: Commit expanded lens library
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/lens-library-v410.yml
          git add index.html
          git commit -m "Photography App v4.1.0 expand common lens library"
          git push
