                <b>3. Set your creative intent:</b> Pick your desired depth of field, motion blur, and <span id="grainTermText">grain</span>.<br>
                <b>4. Get your settings:</b> See recommended ISO, aperture, and shutter. Tap <b>Show Alternatives</b> for more options.<br>
                <b>5. Advanced:</b> Open Advanced for bracketing, reciprocity, push/pull, and more.<br>'''
          new='''<b>1. Match the light:</b> Move the scene-light slider until the description matches what you see. A general recommendation appears immediately.<br>
                <b>2. Get your settings:</b> Use the recommended ISO, aperture, and shutter, or open Alternatives.<br>
                <b>3. Refine if you want:</b> Open <b>Gear</b> and/or <b>Creative Intent</b> in any order. Neither is required.<br>
                <b>4. More Tools:</b> Open the specialized tools only when you need them.<br>'''
          s=s.replace(old,new)
          s=re.sub(r'<script id="v430DashboardPatch">.*?</script>\s*','',s,flags=re.S)
          js=r'''(function(){
            var modeEl=document.getElementById('captureMode');
