name: Apply Photography App v4.3.0 dashboard
'on':
  push:
    paths:
      - '.github/workflows/apply-v430-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.3.0 dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Version 4.2.3 — September 2026','Version 4.3.0 — September 2026')
          old='''<b>1. Set your gear:</b> Choose your camera, lens, focal length, film, and ISO.<br>
