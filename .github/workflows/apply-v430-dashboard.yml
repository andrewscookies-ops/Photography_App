            recalc=function(){var out=document.getElementById('output'),warn=document.getElementById('warning');if(!out||!warn)return;var cn=document.getElementById('cameraSelect')?.value||'',ln=document.getElementById('lensSelect')?.value||'';if(cn==='__custom__'||ln==='__custom__')return;var cam=findCameraByName(cn)||null,lens=findLensByName(ln)||null,film=currentFilm(),focal=foc(lens),ev=effectiveEV(),cc=cam||GENERAL_CAMERA,cl=lens||GENERAL_LENS,rec=recommend(ev,film,cl,focal,cc);var w=String(rec.warns||'').split(' • ').filter(function(x){if(!cam&&(x.indexOf('camera capability')>=0||x.indexOf('Use ND')===0))return false;if(!lens&&x.indexOf('Aperture limit:')===0)return false;return true;}).join(' • ');var txt='ISO '+rec.iso+' • f/'+rec.N.toFixed(1)+' • '+fmtSh(rec.t);if(out.textContent!==txt){out.textContent=txt;if(!window.__evDragging){out.classList.remove('flash-animate');void out.offsetWidth;out.classList.add('flash-animate');}}var hr=document.getElementById('headerRecommendation');if(hr)hr.textContent=txt;warn.textContent=w;var sc=document.getElementById('recommendationScope');if(sc){var a=[];if(cam)a.push(cam.name);if(lens)a.push(lens.name);if(film)a.push(film.name);sc.textContent=a.length?'Refined for: '+a.join(' • '):'General recommendation — no specific camera, lens, or film limits applied.';}why(rec,ev,cam,lens,film,focal);try{var c=buildCompactAlternatives(ev,film,cl,isFinite(focal)?focal:50,cc,rec),tb=document.querySelector('#altTable tbody');if(tb){tb.innerHTML='';c.forEach(function(r){var tr=document.createElement('tr');tr.innerHTML='<td>'+r.iso+'</td><td>f/'+r.N.toFixed(1)+'</td><td>'+fmtSh(r.t)+'</td>';tb.appendChild(tr);});}var f=buildFullAlternatives(ev,film,cl,isFinite(focal)?focal:50,cc),tbf=document.querySelector('#altTableFull tbody');if(tbf){tbf.innerHTML='';f.forEach(function(r){var tr=document.createElement('tr');tr.innerHTML='<td>'+r.iso+'</td><td>f/'+r.N.toFixed(1)+'</td><td>'+fmtSh(r.t)+'</td>';tbf.appendChild(tr);});}}catch(e){}updateD