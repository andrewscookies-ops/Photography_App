            refreshLenses=function(){var cn=document.getElementById('cameraSelect')?.value||'',sel=document.getElementById('lensSelect');if(!sel)return;var prev=sel.value||'',cam=findCameraByName(cn);if(!cam){sel.innerHTML='<option value="">No specific lens</option><option value="__custom__">Custom…</option>';sel.value='';var f=document.getElementById('focalInput');if(f){f.readOnly=false;f.removeAttribute('min');f.removeAttribute('max');}return;}var all=(loadUserStore().lenses||[]).concat(builtinLensesForMode(currentCaptureMode(),showAllBuiltinsEnabled())),list=all.filter(function(l){return l.mount===cam.mount;}),customs=(loadUserStore().lenses||[]).filter(function(l){return l.mount===cam.mount;}),opts=['<option value="">No specific lens</option>'];if(customs.length)opts.push('<optgroup label="Custom / Recent">'+customs.map(function(l){return'<option value="'+l.name+'">'+l.name+'</option>';}).join('')+'</optgroup>');opts.push('<optgroup label="Built-in">'+list.map(function(l){return'<option value="'+l.name+'">'+l.name+'</option>';}).join('')+'</optgroup><option value="__custom__">Custom…</option>');sel.innerHTML=opts.join('');sel.value=[].slice.call(sel.options).some(function(x){return x.value===prev;})?prev:'';var lens=findLensByName(sel.value);if(lens)updateFocalConstraint(lens,true);};
