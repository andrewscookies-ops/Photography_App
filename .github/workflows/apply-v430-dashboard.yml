name: Apply Photography App v4.3.2 sharing UI
'on':
  push:
    paths:
      - '.github/workflows/apply-v430-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.3.2 app sharing UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Version 4.3.1 — September 2026','Version 4.3.2 — September 2026')

          if 'id="shareAppBtn"' not in s:
              old='''    <button id="helpBtn" class="icon-btn" title="Quick Start & Help" aria-label="Quick Start and Help" style="font-size:18px;width:auto;">❓</button>\n    <button id="settingsBtn" class="icon-btn" title="Settings">⋮</button>'''
              new='''    <button id="helpBtn" class="icon-btn" title="Quick Start & Help" aria-label="Quick Start and Help" style="font-size:18px;width:auto;">❓</button>\n    <button id="shareAppBtn" class="icon-btn" title="Share Photography App" aria-label="Share Photography App" style="width:auto;display:inline-flex;align-items:center;justify-content:center;">\n      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>\n    </button>\n    <button id="settingsBtn" class="icon-btn" title="Settings">⋮</button>'''
              if old not in s:
                  raise SystemExit('header share insertion point not found')
              s=s.replace(old,new,1)

          if 'id="shareAppMenuBtn"' not in s:
              old='''        <button id="themeBtn">Theme: Auto</button>\n        <div class="divider"></div>'''
              new='''        <button id="themeBtn">Theme: Auto</button>\n        <button id="shareAppMenuBtn">Share app</button>\n        <div class="divider"></div>'''
              if old not in s:
                  raise SystemExit('settings share insertion point not found')
              s=s.replace(old,new,1)

          if 'id="shareAppModal"' not in s:
              modal='''<!-- Share App Modal -->\n<div id="shareAppModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shareAppTitle" style="display:none;">\n  <div class="modal-content" style="max-width:430px;text-align:center;">\n    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;text-align:left">\n      <div id="shareAppTitle" style="font-weight:650">Share Photography App</div>\n      <button id="shareAppClose" class="icon-btn" style="width:auto" aria-label="Close Share App">✕</button>\n    </div>\n    <div class="sub" style="font-size:13px;line-height:1.45;margin:0 0 12px">Scan the QR code or send the link to open the web app.</div>\n    <div id="shareAppQRWrap" style="display:flex;justify-content:center;margin:8px auto 14px;">\n      <div id="shareAppQR" style="display:inline-flex;align-items:center;justify-content:center;min-width:236px;min-height:236px;padding:8px;background:#fff;border-radius:12px;border:1px solid var(--border);"></div>\n    </div>\n    <label for="shareAppUrl" style="text-align:left">Web app link</label>\n    <input id="shareAppUrl" type="text" readonly value="https://andrewscookies-ops.github.io/Photography_App/" style="font-size:13px">\n    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">\n      <button id="copyAppLinkBtn" style="flex:1 1 140px">Copy Link</button>\n      <button id="nativeShareAppBtn" style="flex:1 1 140px">Share…</button>\n    </div>\n  </div>\n</div>\n'''
              marker='<!-- About Modal -->'
              if marker not in s:
                  raise SystemExit('share modal insertion point not found')
              s=s.replace(marker,modal+marker,1)

          s=s.replace('<button id="shareBtn" style="width:auto">Share</button>','<button id="shareBtn" style="width:auto">Share Settings</button>')

          s=re.sub(r'<script id="shareAppFeature">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script id="shareAppQrLibrary"[^>]*></script>\s*','',s,flags=re.S)

          feature=r'''<script id="shareAppQrLibrary" src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script id="shareAppFeature">
(function(){
  var SHARE_APP_URL='https://andrewscookies-ops.github.io/Photography_App/';
  var qrRendered=false;

  function modal(){ return document.getElementById('shareAppModal'); }
  function renderQR(){
    var host=document.getElementById('shareAppQR');
    if(!host || qrRendered) return;
    host.innerHTML='';
    if(typeof QRCode==='function'){
      try{
        new QRCode(host,{text:SHARE_APP_URL,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
        qrRendered=true;
        return;
      }catch(e){}
    }
    host.innerHTML='<div style="max-width:210px;color:#333;font-size:13px;line-height:1.4">QR code could not load. Use Copy Link below.</div>';
  }
  function openShareApp(){
    var m=modal(); if(!m) return;
    var input=document.getElementById('shareAppUrl'); if(input) input.value=SHARE_APP_URL;
    var menu=document.getElementById('settingsMenu'); if(menu) menu.style.display='none';
    m.style.display='flex';
    renderQR();
  }
  function closeShareApp(){ var m=modal(); if(m) m.style.display='none'; }
  function copiedState(btn){
    if(!btn) return;
    var old=btn.textContent;
    btn.textContent='Copied!';
    setTimeout(function(){btn.textContent=old;},1200);
  }
  function copyLink(){
    var btn=document.getElementById('copyAppLinkBtn');
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(SHARE_APP_URL).then(function(){copiedState(btn);},fallbackCopy);
    }else fallbackCopy();
    function fallbackCopy(){
      var input=document.getElementById('shareAppUrl');
      if(!input) return;
      input.focus(); input.select(); input.setSelectionRange(0,input.value.length);
      try{ document.execCommand('copy'); copiedState(btn); }catch(e){}
    }
  }
  function nativeShare(){
    if(navigator.share){
      navigator.share({title:'Photography App',text:'Photography App',url:SHARE_APP_URL}).catch(function(){});
    }else{
      copyLink();
    }
  }
  function bind(){
    document.getElementById('shareAppBtn')?.addEventListener('click',openShareApp);
    document.getElementById('shareAppMenuBtn')?.addEventListener('click',openShareApp);
    document.getElementById('shareAppClose')?.addEventListener('click',closeShareApp);
    document.getElementById('copyAppLinkBtn')?.addEventListener('click',copyLink);
    document.getElementById('nativeShareAppBtn')?.addEventListener('click',nativeShare);
    modal()?.addEventListener('click',function(e){if(e.target===this)closeShareApp();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape' && modal()?.style.display==='flex')closeShareApp();});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind); else bind();
})();
</script>'''
          s=s.replace('</body>',feature+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit app update
        shell: bash
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Photography App v4.3.2 add app sharing QR and link" || exit 0
          git push
