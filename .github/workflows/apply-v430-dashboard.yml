name: Apply Photography App v4.3.0 dashboard
'on':
  push:
    paths:
      - '.github/workflows/apply-v430-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard workflow
        shell: bash
        run: |
          echo '__PATCH_B64__' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          grep -q 'Version 4.3.0' index.html
          grep -q 'General / no specific gear' index.html
          grep -q 'Why these settings?' index.html
      - name: Commit v4.3.0
        shell: bash
        run: |
          git config user.name 'Photography App Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Photography App v4.3.0 simplify shooting workflow'
          git push
