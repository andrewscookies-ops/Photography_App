            var gearCard=(function(){var h=[].slice.call(document.querySelectorAll('.section-header')).find(function(x){return x.textContent.trim()==='Gear Setup';});var c=h&&h.closest('.card');if(c){c.id='gearCard';c.style.display='none';}return c;})();
            var fi=document.getElementById('focalInput');if(fi){fi.value='';fi.placeholder='Optional';fi.readOnly=false;fi.removeAttribute('min');fi.removeAttribute('max');}
