name: Apply Photography App v4.3.2 sharing UI
'on':
  push:
    paths:
      - '.github/workflows/apply-v430-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.3.2 app sharing UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          p=Path('index.html')
          s=p.read_text()
          dec=lambda x: base64.b64decode(x).decode('utf-8')
          header_old=dec('')
          header_new=dec('')
          settings_old=dec('ICAgICAgICA8YnV0dG9uIGlkPSJ0aGVtZUJ0biI+VGhlbWU6IEF1dG88L2J1dHRvbj4KICAgICAgICA8ZGl2IGNsYXNzPSJkaXZpZGVyIj48L2Rpdj4=')
          settings_new=dec('ICAgICAgICA8YnV0dG9uIGlkPSJ0aGVtZUJ0biI+VGhlbWU6IEF1dG88L2J1dHRvbj4KICAgICAgICA8YnV0dG9uIGlkPSJzaGFyZUFwcE1lbnVCdG4iPlNoYXJlIGFwcDwvYnV0dG9uPgogICAgICAgIDxkaXYgY2xhc3M9ImRpdmlkZXIiPjwvZGl2Pg==')
          modal=dec('')
          feature=dec('')
          s=s.replace('Version 4.3.1 — September 2026','Version 4.3.2 — September 2026')
          if 'id="shareAppBtn"' not in s:
              if header_old not in s: raise SystemExit('header insertion point not found')
              s=s.replace(header_old,header_new,1)
          if 'id="shareAppMenuBtn"' not in s:
              if settings_old not in s: raise SystemExit('settings insertion point not found')
              s=s.replace(settings_old,settings_new,1)
          if 'id="shareAppModal"' not in s:
              marker='<!-- About Modal -->'
              if marker not in s: raise SystemExit('modal insertion point not found')
              s=s.replace(marker,modal+marker,1)
          s=s.replace('<button id="shareBtn" style="width:auto">Share</button>','<button id="shareBtn" style="width:auto">Share Settings</button>')
          s=re.sub(r'<script id="shareAppFeature">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script id="shareAppQrLibrary"[^>]*></script>\s*','',s,flags=re.S)
          s=s.replace('</body>',feature+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit app update
        shell: bash
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Photography App v4.3.2 add app sharing QR and link" || exit 0
          git push
