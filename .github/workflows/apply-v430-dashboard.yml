name: Apply Photography App Auto ISO
'on':
  push:
    paths:
      - '.github/workflows/apply-v430-dashboard.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Auto ISO, ISO stepper, and input layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          feature=r'''<script id="v440AutoISO">
(function(){
  var AUTO_KEY='photoAppAutoISO_v1';
  var ISO_STEPS=[25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000,40000,51200];
  function loadAuto(){try{return localStorage.getItem(AUTO_KEY)!=='manual';}catch(e){return true;}}
  window.__photoAutoISO=loadAuto();
  function isAutoISO(){return currentCaptureMode()!=='film'&&window.__photoAutoISO!==false;}
  function saveMode(){try{localStorage.setItem(AUTO_KEY,window.__photoAutoISO?'auto':'manual');}catch(e){}}
  function setAutoISO(on){window.__photoAutoISO=!!on;saveMode();updateISOControl();}
  function nearestISO(v){v=Math.max(ISO_STEPS[0],Math.min(ISO_STEPS[ISO_STEPS.length-1],Number(v)||400));var b=ISO_STEPS[0];for(var i=1;i<ISO_STEPS.length;i++)if(Math.abs(ISO_STEPS[i]-v)<Math.abs(b-v))b=ISO_STEPS[i];return b;}
  function stepISO(v,dir){v=Number(v)||400;var idx=0,best=Infinity;for(var i=0;i<ISO_STEPS.length;i++){var d=Math.abs(ISO_STEPS[i]-v);if(d<best){best=d;idx=i;}}idx=Math.max(0,Math.min(ISO_STEPS.length-1,idx+dir));return ISO_STEPS[idx];}
  function apertureTarget(lens,focal){var ci=getCI(),ap=lensApertureAtFocal(lens,focal),deep=Math.min(Math.max(11,ap.minA),ap.maxA),shallow=ap.minA;if(ci.panning)deep=Math.min(ap.maxA,deep*Math.pow(Math.SQRT2,.5));var gb=(ci.grain-.5)*.6,N=deep+(shallow-deep)*ci.blur;N=Math.max(ap.minA,Math.min(ap.maxA,N));if(Math.abs(gb)>.05){N*=Math.pow(Math.SQRT2,-gb);N=Math.max(ap.minA,Math.min(ap.maxA,N));}if(focal&&isFinite(focal)){var r=Math.max(20,Math.min(200,focal))/50;N*=Math.pow(Math.SQRT2,Math.log2(r)*.5);N=Math.max(ap.minA,Math.min(ap.maxA,N));}if(ci.aperturePickN)N=Math.max(ap.minA,Math.min(ap.maxA,ci.aperturePickN));return N;}
  function shutterTarget(focal){var ci=getCI(),a=[1/8,1/30,1/60,1/250,1/500,1/1000],t=a[Math.max(0,Math.min(5,Math.round(ci.freeze*5)))];if(focal&&isFinite(focal))t*=Math.max(.25,Math.min(4,50/focal));if(ci.panning)t*=3;if(ci.shutterPickT)t=ci.shutterPickT;return t;}
  function autoISOFor(ev,lens,focal,camera){var N=apertureTarget(lens,focal),t=shutterTarget(focal),e=ev+(parseFloat(document.getElementById('evBias')?.value)||0),raw=100*N*N/(Math.pow(2,e)*Math.max(t,1/8000)),lo=(camera&&camera.iso_min)||50,hi=(camera&&camera.iso_max)||12800;return nearestISO(Math.max(lo,Math.min(hi,raw)));}
  var baseRecommend=window.recommend;
  if(typeof baseRecommend==='function'){
    window.recommend=function(ev,film,lens,focal,camera){
      if(currentCaptureMode()!=='film'&&isAutoISO()){var a=autoISOFor(ev,lens,focal,camera),q=document.getElementById('quickISO'),n=document.getElementById('isoNumeric');if(q)q.value=String(a);if(n)n.value=String(a);}
      var r=baseRecommend(ev,film,lens,focal,camera);updateISOControl();return r;
    };
    recommend=window.recommend;
  }
  function updateISOControl(){var q=document.getElementById('quickISO'),a=document.getElementById('isoAutoBtn');if(q){q.readOnly=isAutoISO();q.title=isAutoISO()?'Auto ISO is choosing this value. Tap − or + for manual ISO.':'Manual ISO';}if(a){a.classList.toggle('active',isAutoISO());a.setAttribute('aria-pressed',String(isAutoISO()));a.textContent=isAutoISO()?'AUTO':'Auto';}}
  function buildISOControl(){var g=document.getElementById('quickISOGroup'),q=document.getElementById('quickISO');if(!g||!q)return;if(document.getElementById('isoMinusBtn')){updateISOControl();return;}q.remove();g.innerHTML='';g.classList.add('iso-control-group');var lab=document.createElement('label');lab.className='iso-control-label';lab.textContent='ISO';var row=document.createElement('div');row.className='iso-stepper';var m=document.createElement('button');m.type='button';m.id='isoMinusBtn';m.className='iso-step-btn';m.textContent='−';m.setAttribute('aria-label','Decrease ISO');var p=document.createElement('button');p.type='button';p.id='isoPlusBtn';p.className='iso-step-btn';p.textContent='+';p.setAttribute('aria-label','Increase ISO');var a=document.createElement('button');a.type='button';a.id='isoAutoBtn';a.className='iso-auto-btn';a.setAttribute('aria-label','Toggle Auto ISO');q.classList.add('iso-step-value');row.append(m,q,p,a);g.append(lab,row);m.addEventListener('click',function(){setAutoISO(false);q.value=String(stepISO(q.value,-1));var n=document.getElementById('isoNumeric');if(n)n.value=q.value;recalc();});p.addEventListener('click',function(){setAutoISO(false);q.value=String(stepISO(q.value,1));var n=document.getElementById('isoNumeric');if(n)n.value=q.value;recalc();});a.addEventListener('click',function(){setAutoISO(!isAutoISO());recalc();});q.addEventListener('input',function(){if(document.activeElement===q)setAutoISO(false);});updateISOControl();}
  function addStyle(){if(document.getElementById('autoISOStyle'))return;var st=document.createElement('style');st.id='autoISOStyle';st.textContent='.iso-control-group{display:block!important;margin:10px 0 12px}.iso-control-label{display:block!important;max-width:none!important;margin:0 0 5px!important;font-size:12px;color:var(--muted)}.iso-stepper{display:grid;grid-template-columns:44px minmax(82px,120px) 44px minmax(62px,auto);gap:6px;align-items:center}.iso-step-btn,.iso-auto-btn{width:100%;min-height:42px;padding:8px!important;font-weight:700}.iso-step-btn{font-size:18px}.iso-auto-btn{font-size:12px;letter-spacing:.4px}.iso-auto-btn.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}.iso-step-value{width:100%!important;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}.iso-step-value[readonly]{background:var(--chipBg)}#lightCard .dashboard-actions{margin-top:12px;margin-bottom:8px}#lightCard #gearCard,#lightCard #creativeCard{margin:8px 0 10px;box-shadow:none}@media(max-width:420px){.iso-stepper{grid-template-columns:42px minmax(74px,1fr) 42px 62px}}';document.head.appendChild(st);}
  function placeInputsAboveRecommendation(){var light=document.getElementById('lightCard'),rec=document.getElementById('recommendedCard'),actions=document.querySelector('.dashboard-actions'),gear=document.getElementById('gearCard'),creative=document.getElementById('creativeCard'),qg=document.getElementById('quickISOGroup');if(!light||!rec)return;if(qg&&qg.parentNode!==light){var ev=document.getElementById('evCtrl');if(ev&&ev.parentNode===light)light.insertBefore(qg,ev);else light.appendChild(qg);}if(actions&&actions.parentNode!==light)light.appendChild(actions);if(gear&&gear.parentNode!==light)light.appendChild(gear);if(creative&&creative.parentNode!==light)light.appendChild(creative);if(light.nextElementSibling!==rec)light.insertAdjacentElement('afterend',rec);}
  document.addEventListener('DOMContentLoaded',function(){addStyle();setTimeout(function(){buildISOControl();placeInputsAboveRecommendation();var mode=document.getElementById('captureMode');if(mode&&!mode.dataset.autoIsoLayout){mode.dataset.autoIsoLayout='1';mode.addEventListener('change',function(){setTimeout(function(){buildISOControl();placeInputsAboveRecommendation();updateISOControl();recalc();},0);});}updateISOControl();recalc();},0);});
})();
</script>'''
          pat=re.compile(r'<script id="v440AutoISO">.*?</script>',re.S)
          if pat.search(s): s=pat.sub(feature,s)
          elif '</body>' in s: s=s.replace('</body>',feature+'\n</body>',1)
          else: s+='\n'+feature+'\n'
          p.write_text(s)
          PY
      - name: Commit app update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Auto ISO and reorganize shooting controls"
          git push
