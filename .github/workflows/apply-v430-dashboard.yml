            document.addEventListener('DOMContentLoaded',function(){var st=document.createElement('style');st.textContent='.dashboard-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}.dashboard-actions button{font-weight:650;min-height:46px}.gear-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.gear-heading .section-header{margin:0}#gearReset{width:auto;padding:7px 10px;font-size:12px}.intent-stack{display:grid;gap:14px;padding-top:4px}.intent-row>label{font-size:13px!important;font-weight:650;color:var(--text)!important;margin-bottom:6px!important}.intent-row .seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex-wrap:nowrap}.intent-row .seg-btn{min-width:0;flex:none;padding:10px 5px;font-size:12px}.intent-extra{display:flex;gap:18px;margin-top:12px;align-items:center;flex-wrap:wrap}.recommendation-scope{font-size:12px;color:var(--muted);margin:2px 0 8px}.why-settings{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}#whyToggle{width:auto;padding:7px 10px}#whyDetails{display:none;margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--chipBg);font-size:13px;line-height:1.5}#whyDetails ul{margin:0;padding-left:20px}.quick-meter-row{display:flex;align-items:end;gap:10px;margin:0 0 10px}.quick-meter-row label{margin:0;max-width:150px}.quick-meter-row input{margin-top:4px}@media(max-width:520px){.intent-row .seg-btn{font-size:11px;padding:9px 3px}}';document.head.appendChild(st);var wrap=document.querySelector('.wrap'),light=document.getElementById('lightCard'),rec=document.getElementById('recommendedCard'),creative=document.getElementById('creativeCard'),ct=document.getElementById('creativeToggle'),mb=document.getElementById('advancedToggle'),more=document.getElementById('advancedDrawer');if(!gearCard||!wrap||!light||!rec||!creative||!ct||!mb||!more)return;var gh=gearCard.querySelector('.section-header');if(gh)gh.textContent=