name: Apply Photography App v4.3.3 Auto ISO
'on':
  push:
    paths:
      - '.github/workflows/apply-v433-auto-iso.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Auto ISO fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Version 4.3.2 — September 2026','Version 4.3.3 — September 2026')
          s=re.sub(r'<script id="v433AutoISO">.*?</script>\s*','',s,flags=re.S)
          feature=base64.b64decode('').decode()
          s=s.replace('</body>',feature+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit app update
        shell: bash
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-v433-auto-iso.yml
          git commit -m "Photography App v4.3.3 fix Auto ISO behavior"
          git push
