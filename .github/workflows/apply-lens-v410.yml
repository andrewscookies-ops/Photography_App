name: Apply lens library v4.1.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-lens-v410.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update built-in lenses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('.github/workflows/lens-library-v410.yml').read_text(encoding='utf-8')
          film=re.search(r"film_lenses=r'''(.*?)'''",src,re.S)
          digital=re.search(r"digital_lenses=r'''(.*?)'''",src,re.S)
          if not film or not digital:
              raise SystemExit('Could not read lens data')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'var lensesBuiltin=\[.*?\n\];',film.group(1),s,count=1,flags=re.S)
          s,n2=re.subn(r'var lensesDigitalBuiltin=\[.*?\n\];',digital.group(1),s,count=1,flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Lens block replacement failed: {n1}, {n2}')
          s=s.replace('Version 4.0.9 — September 2026','Version 4.1.0 — September 2026',1)
          mounts=['nikon_f','canon_fd','pentax_k','minolta_sr','olympus_om','sony_e','canon_rf','nikon_z','fujifilm_x','l_mount','canon_eos']
          counts={m:s.count('mount:"'+m+'"') for m in mounts}
          bad={m:c for m,c in counts.items() if c<14}
          if bad:
              raise SystemExit('Insufficient lens coverage: '+repr(bad))
          if 'Version 4.1.0' not in s:
              raise SystemExit('Version bump missing')
          p.write_text(s,encoding='utf-8')
          print(counts)
          PY
      - name: Commit v4.1.0
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-lens-v410.yml .github/workflows/lens-library-v410.yml
          git add index.html
          git commit -m "Photography App v4.1.0 expand common lens library"
          git push
