name: Apply Photography App v4.4.0

on:
  push:
    paths:
      - ".github/workflows/apply-v440.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.4.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")

          if 'auto-iso-v440.js?v=440' in s:
              print("v4.4.0 already applied")
              raise SystemExit(0)

          old_version = "Version 4.3.2 — September 2026"
          new_version = "Version 4.4.0 — September 2026"
          if old_version not in s:
              raise SystemExit("Expected v4.3.2 version marker not found")
          s = s.replace(old_version, new_version, 1)

          old_general = """    var ci=getCI(),iso=getSelectedISO()||400;
              var N=interp([16,11,8,4,2],ci.blur);
              var target=interp([1/15,1/30,1/125,1/500,1/1000],ci.freeze);"""
          new_general = """    var ci=getCI(),iso=getSelectedISO()||400;
              var N=interp([16,11,8,4,2],ci.blur);
              if(focal&&isFinite(focal)){
                var focalRatio=Math.max(20,Math.min(200,focal))/50;
                N*=Math.pow(Math.SQRT2,Math.log2(focalRatio)*0.5);
                N=Math.max(1,Math.min(32,N));
              }
              var target=interp([1/15,1/30,1/125,1/500,1/1000],ci.freeze);"""
          if old_general not in s:
              raise SystemExit("General focal-length insertion point not found")
          s = s.replace(old_general, new_general, 1)

          marker = '<script id="shareAppQrLibrary" src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>'
          if marker not in s:
              raise SystemExit("Share-library marker not found")
          s = s.replace(marker, '<script src="auto-iso-v440.js?v=440"></script>\n' + marker, 1)

          path.write_text(s, encoding="utf-8")
          print("Applied v4.4.0")
          PY

      - name: Validate
        shell: bash
        run: |
          node --check auto-iso-v440.js
          grep -q 'Version 4.4.0 — September 2026' index.html
          grep -q 'auto-iso-v440.js?v=440' index.html
          grep -q 'id="v430DashboardPatch"' index.html
          grep -q 'id="v431GeneralExposureFix"' index.html
          grep -q 'id="shareAppFeature"' index.html
          if grep -q "fetch('app-core.html" index.html; then
            echo "Loader architecture found unexpectedly"
            exit 1
          fi

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Photography App v4.4.0 Auto ISO and focal refinement"
          git push
