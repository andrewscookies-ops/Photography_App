auto = '<script id="v440AutoISO">\n(function(){\n  var AUTO_ISO_VALUES=[25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000,40000,51200];\n  var autoISOEnabled=true;\n  var autoISOContext=null;\n\n  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }\n  function interp(vals,x){\n    x=clamp(Number(x)||0,0,1)*(vals.length-1);\n    var i=Math.floor(x),j=Math.min(vals.length-1,i+1),f=x-i;\n    return vals[i]+(vals[j]-vals[i])*f;\n  }\n  function snapISO(v){\n    v=clamp(Number(v)||400,AUTO_ISO_VALUES[0],AUTO_ISO_VALUES[AUTO_ISO_VALUES.length-1]);\n    var best=AUTO_ISO_VALUES[0],d=Infinity;\n    AUTO_ISO_VALUES.forEach(function(x){\n      var dd=Math.abs(Math.log2(x/v));\n      if(dd<d){d=dd;best=x;}\n    });\n    return best;\n  }\n  function filmMode(){ return currentCaptureMode()===\'film\'; }\n  function selectedCamera(){\n    var name=document.getElementById(\'cameraSelect\')?.value||\'\';\n    return name?findCameraByName(name)||null:null;\n  }\n  function selectedLens(){\n    var name=document.getElementById(\'lensSelect\')?.value||\'\';\n    return name?findLensByName(name)||null:null;\n  }\n  function selectedFocal(lens){\n    if(lens){\n      try{return focalValueForLens(lens);}catch(e){}\n    }\n    var v=parseFloat(document.getElementById(\'focalInput\')?.value);\n    return isFinite(v)&&v>0?v:null;\n  }\n  function targetAperture(lens,focal,ci){\n    var N;\n    if(lens){\n      var ap=lensApertureAtFocal(lens,focal||focalValueForLens(lens));\n      var deep=Math.min(Math.max(11,ap.minA),ap.maxA);\n      var shallow=ap.minA;\n      N=deep+(shallow-deep)*ci.blur;\n      if(focal&&isFinite(focal)){\n        var ratio=clamp(focal,20,200)/50;\n        N*=Math.pow(Math.SQRT2,Math.log2(ratio)*0.5);\n      }\n      N=clamp(N,ap.minA,ap.maxA);\n    }else{\n      N=interp([16,11,8,4,2],ci.blur);\n      if(focal&&isFinite(focal)){\n        var ratio2=clamp(focal,20,200)/50;\n        N*=Math.pow(Math.SQRT2,Math.log2(ratio2)*0.5);\n      }\n      N=clamp(N,1,32);\n    }\n    return N;\n  }\n  function targetShutter(camera,focal,ci){\n    var t=interp([1/15,1/30,1/125,1/500,1/1000],ci.freeze);\n    if(focal&&isFinite(focal)) t*=clamp(50/focal,0.25,4);\n    if(ci.panning) t*=3;\n    // A tripod removes camera-shake pressure, but it cannot stop subject motion.\n    if(ci.tripod && !ci.panning && ci.freeze<=0.5) t*=4;\n    if(camera&&camera.max_shutter_den){\n      t=Math.max(t,1/camera.max_shutter_den);\n    }\n    return t;\n  }\n  function filmISO(){\n    return Math.max(1,parseInt(document.getElementById(\'isoSelect\')?.value,10)||400);\n  }\n  function manualISO(){\n    return Math.max(1,parseInt(document.getElementById(\'quickISO\')?.value,10)||parseInt(document.getElementById(\'isoNumeric\')?.value,10)||400);\n  }\n  function computeAutoISO(){\n    var ev=effectiveEV()+(parseFloat(document.getElementById(\'evBias\')?.value)||0);\n    var ci=getCI();\n    var camera=selectedCamera();\n    var lens=selectedLens();\n    var focal=selectedFocal(lens);\n    var N=targetAperture(lens,focal,ci);\n    var t=targetShutter(camera,focal,ci);\n    var raw=100*(N*N)/(Math.pow(2,ev)*Math.max(t,1/32000));\n\n    // Grain/noise preference gets a modest influence without overpowering\n    // depth-of-field or motion intent: clean trends lower, gritty trends higher.\n    raw*=Math.pow(2,(ci.grain-0.5)*1.33);\n\n    // Broad general range. If future camera data supplies ISO limits, honor it.\n    var lo=(camera&&camera.iso_min)||AUTO_ISO_VALUES[0];\n    var hi=(camera&&camera.iso_max)||AUTO_ISO_VALUES[AUTO_ISO_VALUES.length-1];\n    lo=Math.max(AUTO_ISO_VALUES[0],lo);\n    hi=Math.min(AUTO_ISO_VALUES[AUTO_ISO_VALUES.length-1],hi);\n    if(hi<lo){var tmp=hi;hi=lo;lo=tmp;}\n    var clipped=raw<lo?\'low\':(raw>hi?\'high\':\'\');\n    var iso=snapISO(clamp(raw,lo,hi));\n\n    autoISOContext={iso:iso,raw:raw,ev:ev,N:N,t:t,camera:camera,lens:lens,focal:focal,ci:ci,clipped:clipped,lo:lo,hi:hi};\n    return iso;\n  }\n  function setQuickISO(v){\n    var q=document.getElementById(\'quickISO\');\n    var n=document.getElementById(\'isoNumeric\');\n    if(q) q.value=String(v);\n    if(n) n.value=String(v);\n  }\n  function updateAutoUI(){\n    var q=document.getElementById(\'quickISO\');\n    var btn=document.getElementById(\'isoAutoBtn\');\n    var hint=document.getElementById(\'autoISOHint\');\n    if(!q||!btn) return;\n    if(filmMode()){\n      btn.style.display=\'none\';\n      q.readOnly=false;\n      if(hint) hint.textContent=\'Film speed stays fixed to the selected film ISO.\';\n      return;\n    }\n    btn.style.display=\'\';\n    if(autoISOEnabled){\n      var iso=autoISOContext?autoISOContext.iso:computeAutoISO();\n      setQuickISO(iso);\n      q.readOnly=true;\n      q.setAttribute(\'aria-readonly\',\'true\');\n      q.title=\'Auto ISO is choosing this value from the light and your active shooting choices.\';\n      btn.classList.add(\'active\');\n      btn.setAttribute(\'aria-pressed\',\'true\');\n      btn.textContent=\'AUTO\';\n      if(hint) hint.textContent=\'Auto ISO changes with light, focal length, gear limits, and Creative Intent.\';\n    }else{\n      q.readOnly=false;\n      q.removeAttribute(\'aria-readonly\');\n      q.title=\'Manual ISO\';\n      btn.classList.remove(\'active\');\n      btn.setAttribute(\'aria-pressed\',\'false\');\n      btn.textContent=\'Auto\';\n      if(hint) hint.textContent=\'Manual ISO — tap Auto to let the app choose sensitivity.\';\n    }\n  }\n  function enhanceWhy(){\n    var host=document.getElementById(\'whyDetails\');\n    if(!host) return;\n    host.querySelectorAll(\'[data-auto-iso-note],[data-film-grain-note]\').forEach(function(n){n.remove();});\n    var ul=host.querySelector(\'ul\');\n    if(!ul) return;\n\n    if(!filmMode()&&autoISOEnabled&&autoISOContext){\n      var li=document.createElement(\'li\');\n      li.setAttribute(\'data-auto-iso-note\',\'1\');\n      li.textContent=\'Auto ISO chose ISO \'+autoISOContext.iso+\' to balance the current light with the aperture and shutter targets created by your active settings\'+(autoISOContext.focal?\' at \'+Math.round(autoISOContext.focal)+\'mm\':\'\')+\'.\';\n      ul.insertBefore(li,ul.children[1]||null);\n      if(autoISOContext.clipped){\n        var lim=document.createElement(\'li\');\n        lim.setAttribute(\'data-auto-iso-note\',\'1\');\n        lim.textContent=autoISOContext.clipped===\'high\'\n          ? \'Auto ISO reached the current upper ISO limit, so the app may need a wider aperture, slower shutter, or more light.\'\n          : \'Auto ISO reached the current lower ISO limit, so the app may need a smaller aperture, faster shutter, or ND filter.\';\n        ul.appendChild(lim);\n      }\n    }\n\n    var film=null;\n    if(filmMode()){\n      try{ film=currentFilm(); }catch(e){}\n    }\n    if(film){\n      var fg=document.createElement(\'li\');\n      fg.setAttribute(\'data-film-grain-note\',\'1\');\n      if(film.box_iso<=100){\n        fg.textContent=\'As a slower ISO \'+film.box_iso+\' film, \'+film.name+\' generally favors finer grain than faster film; exact grain still depends on the emulsion and development.\';\n      }else if(film.box_iso>=800){\n        fg.textContent=\'As a fast ISO \'+film.box_iso+\' film, \'+film.name+\' generally shows more grain than slower film; exact grain still depends on the emulsion and development.\';\n      }else{\n        fg.textContent=film.name+\' is an ISO \'+film.box_iso+\' stock, so its grain is generally more visible than slower film and less pronounced than very fast film; exact grain depends on the emulsion and development.\';\n      }\n      ul.appendChild(fg);\n    }\n  }\n  function installUI(){\n    var group=document.getElementById(\'quickISOGroup\');\n    var q=document.getElementById(\'quickISO\');\n    if(!group||!q) return;\n    group.classList.add(\'auto-iso-group\');\n    var label=q.closest(\'label\');\n    if(label){\n      var first=label.firstChild;\n      if(first&&first.nodeType===3) first.nodeValue=\'ISO \';\n    }\n    if(!document.getElementById(\'isoAutoBtn\')){\n      var btn=document.createElement(\'button\');\n      btn.type=\'button\';\n      btn.id=\'isoAutoBtn\';\n      btn.className=\'iso-auto-btn\';\n      btn.setAttribute(\'aria-label\',\'Toggle Auto ISO\');\n      btn.setAttribute(\'aria-pressed\',\'true\');\n      btn.textContent=\'AUTO\';\n      group.appendChild(btn);\n    }\n    if(!document.getElementById(\'autoISOHint\')){\n      var hint=document.createElement(\'div\');\n      hint.id=\'autoISOHint\';\n      hint.className=\'sub auto-iso-hint\';\n      group.appendChild(hint);\n    }\n  }\n  function addStyles(){\n    if(document.getElementById(\'v440AutoISOStyle\')) return;\n    var st=document.createElement(\'style\');\n    st.id=\'v440AutoISOStyle\';\n    st.textContent=\'.auto-iso-group{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.auto-iso-group label{flex:0 1 150px}.iso-auto-btn{width:auto!important;min-width:68px;min-height:42px;padding:8px 12px!important;font-weight:750;letter-spacing:.3px}.iso-auto-btn.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}.auto-iso-hint{flex:1 1 100%;margin-top:-2px}.auto-iso-group input[readonly]{background:var(--chipBg);font-weight:700}\';\n    document.head.appendChild(st);\n  }\n\n  document.addEventListener(\'DOMContentLoaded\',function(){\n    addStyles();\n    installUI();\n\n    // Replace the manual-only selector installed by v4.3.1.\n    getSelectedISO=function(){\n      if(filmMode()) return filmISO();\n      if(autoISOEnabled){\n        var v=computeAutoISO();\n        setQuickISO(v);\n        return v;\n      }\n      autoISOContext=null;\n      return manualISO();\n    };\n\n    var baseRecalc=recalc;\n    recalc=function(){\n      baseRecalc();\n      updateAutoUI();\n      enhanceWhy();\n    };\n\n    var btn=document.getElementById(\'isoAutoBtn\');\n    if(btn&&!btn.dataset.v440){\n      btn.dataset.v440=\'1\';\n      btn.addEventListener(\'click\',function(){\n        if(filmMode()) return;\n        autoISOEnabled=!autoISOEnabled;\n        if(autoISOEnabled) autoISOContext=null;\n        recalc();\n      });\n    }\n\n    var q=document.getElementById(\'quickISO\');\n    if(q&&!q.dataset.v440){\n      q.dataset.v440=\'1\';\n      q.addEventListener(\'keydown\',function(e){\n        if(e.key===\'Enter\'&&!autoISOEnabled) this.blur();\n      });\n    }\n\n    var mode=document.getElementById(\'captureMode\');\n    if(mode&&!mode.dataset.v440){\n      mode.dataset.v440=\'1\';\n      mode.addEventListener(\'change\',function(){\n        autoISOContext=null;\n        setTimeout(recalc,0);\n      });\n    }\n\n    var reset=document.getElementById(\'gearReset\');\n    if(reset&&!reset.dataset.v440){\n      reset.dataset.v440=\'1\';\n      reset.addEventListener(\'click\',function(){\n        autoISOEnabled=true;\n        autoISOContext=null;\n        setTimeout(recalc,0);\n      });\n    }\n\n    // Auto is the normal default for General/Digital; Film remains fixed.\n    autoISOEnabled=true;\n    autoISOContext=null;\n    recalc();\n  });\n})();\n</script>'
s = s.replace(marker, auto + "\n" + marker, 1)

path.write_text(s, encoding="utf-8")
