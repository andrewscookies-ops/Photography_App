name: Apply Photography App v4.4.0

on:
  push:
    paths:
      - ".github/workflows/apply-v440.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.4.0
        shell: bash
        run: |
          printf '%s' ' ' | base64 -d > /tmp/apply_v440.py
          python /tmp/apply_v440.py

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          needed=[
              'Version 4.4.0 — September 2026',
              'id="v440AutoISO"',
              'id="v430DashboardPatch"',
              'id="v431GeneralExposureFix"',
              'id="shareAppFeature"',
              'Auto ISO changes with light'
          ]
          missing=[x for x in needed if x not in s]
          if missing:
              raise SystemExit("Missing markers: "+repr(missing))
          if "fetch('app-core.html" in s:
              raise SystemExit("Loader architecture found in index.html")
          m=re.search(r'<script id="v440AutoISO">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit("v440 Auto ISO script not found")
          Path("/tmp/v440.js").write_text(m.group(1),encoding="utf-8")
          print("v4.4.0 markers validated")
          PY
          node --check /tmp/v440.js

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Photography App v4.4.0 clean Auto ISO rebuild"
          git push
