name: Apply Photography App v4.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v420.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.2.0 update
        run: python3 scripts/apply_v420.py
      - name: Commit v4.2.0
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/advanced-ui-v411.yml
          rm -f .github/workflows/apply-v420.yml
          rm -f scripts/apply_v420.py
          git add -A
          git commit -m "Photography App v4.2.0 simplify light metering and Advanced UI"
          git push
