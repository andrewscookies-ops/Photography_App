name: One-time photography app hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          # 1) Light meter: remove handle animation that makes the thumb trail the finger.
          replace_once(
              "@media (prefers-reduced-motion: no-preference){\n  .ev-control .ev-handle{ transition:left .06s linear; }\n}",
              ".ev-control .ev-handle{ transition:none; will-change:left; }\n.ev-control.ev-dragging{ cursor:grabbing; }",
              'EV handle transition'
          )

          # 2) Light meter: keep drag path lightweight; recalc once on release.
          replace_once(
              "    if(source==='drag'){\n      scheduleDragRecalc();\n    }else if(source==='kb'){",
              "    if(source==='drag'){\n      // Drag stays visually immediate; full exposure recalculation happens on release.\n    }else if(source==='kb'){",
              'drag recalc branch'
          )
          replace_once(
              "  function startDrag(clientX){\n    setEV(tToEv(pxToT(clientX)), 'drag');\n    if(tip){ tip.removeAttribute('aria-hidden'); }\n    dragging=true;\n  }\n  function moveDrag(clientX){ if(dragging) setEV(tToEv(pxToT(clientX)), 'drag'); }\n  function endDrag(){\n    if(!dragging) return;\n    dragging=false;\n    if(tip){ tip.setAttribute('aria-hidden','true'); }\n    scheduleDragRecalc();\n  }",
              "  function startDrag(clientX){\n    dragging=true;\n    ctrl.classList.add('ev-dragging');\n    setEV(tToEv(pxToT(clientX)), 'drag');\n    if(tip){ tip.removeAttribute('aria-hidden'); }\n  }\n  function moveDrag(clientX){ if(dragging) setEV(tToEv(pxToT(clientX)), 'drag'); }\n  function endDrag(){\n    if(!dragging) return;\n    dragging=false;\n    ctrl.classList.remove('ev-dragging');\n    if(tip){ tip.setAttribute('aria-hidden','true'); }\n    try{ recalc(); }catch(_e){}\n  }",
              'drag lifecycle'
          )

          # 3) Explicitly block touch scrolling while interacting with the EV control (iOS included).
          replace_once(
              "    ctrl.addEventListener('pointercancel', pointerCancelHandler);\n\n    ctrl.addEventListener('keydown', function(e){",
              "    ctrl.addEventListener('pointercancel', pointerCancelHandler);\n    ctrl.addEventListener('touchstart', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});\n    ctrl.addEventListener('touchmove', function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});\n\n    ctrl.addEventListener('keydown', function(e){",
              'touch scroll prevention'
          )

          # 4) Remove duplicated Help event wiring. The earlier block already handles open/close/escape.
          pattern = re.compile(r"// Help modal open/close logic\n.*?(?=  function hiddenNumber\(id,val\)\{)", re.S)
          s, n = pattern.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'duplicate Help handlers: expected 1 block, found {n}')

          # 5) About should open the modal only, not also fire an alert.
          replace_once(
              "  document.getElementById('aboutBtn').addEventListener('click',function(){menu.style.display='none';alert('© 2025 Andrew Harris. Created with AI assistance.')});",
              "  document.getElementById('aboutBtn').addEventListener('click',function(){menu.style.display='none';});",
              'About alert handler'
          )

          # 6) Restore the existing Copy/Share feature by adding its missing buttons.
          replace_once(
              "    <div style=\"display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap\">\n      <button id=\"altToggle\">Show Alternatives</button>\n    </div>",
              "    <div style=\"display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap\">\n      <button id=\"altToggle\" style=\"width:auto;flex:1 1 180px\">Show Alternatives</button>\n      <button id=\"copyBtn\" style=\"width:auto\">Copy</button>\n      <button id=\"shareBtn\" style=\"width:auto\">Share</button>\n    </div>",
              'recommended action buttons'
          )

          # 7) Remove the broken pseudo-mode that hides Film but still requires a film selection.
          replace_once(
              "        <option value=\"all\">All built-ins</option>\n",
              "",
              'All built-ins capture mode'
          )

          # 8) Persist custom gear in localStorage while retaining embedded-data compatibility.
          store_pattern = re.compile(r"function loadUserStore\(\)\{.*?\n\}\nfunction saveUserStore\(obj\)\{.*?\n\}\n// Download a new HTML", re.S)
          store_replacement = r'''var USER_STORE_KEY='photoAppUserGear_v2';
function normalizeUserStore(obj){
  if(!obj||typeof obj!=='object') obj={};
  obj.cameras=Array.isArray(obj.cameras)?obj.cameras:[];
  obj.lenses=Array.isArray(obj.lenses)?obj.lenses:[];
  obj.films=Array.isArray(obj.films)?obj.films:[];
  return obj;
}
function loadUserStore(){
  try{
    var saved=localStorage.getItem(USER_STORE_KEY);
    if(saved){ return normalizeUserStore(JSON.parse(saved)); }
  }catch(e){}
  try{
    var n=getEmbeddedNode();
    var txt=n.textContent||n.innerText||'{}';
    return normalizeUserStore(JSON.parse(txt));
  }catch(e){ return {cameras:[],lenses:[],films:[]}; }
}
function saveUserStore(obj){
  try{
    var clean=normalizeUserStore(obj);
    var payload=JSON.stringify({cameras:clean.cameras,lenses:clean.lenses,films:clean.films});
    var n=getEmbeddedNode();
    n.textContent=payload;
    try{ localStorage.setItem(USER_STORE_KEY,payload); }catch(_e){}
  }catch(e){}
}
// Download a new HTML'''
          s, n = store_pattern.subn(store_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'custom gear persistence block: expected 1, found {n}')

          # 9) Remove duplicate Capture Mode wiring; initApp owns this behavior.
          mode_pattern = re.compile(r"\(function\(\)\{\n  var modeSel=document.getElementById\('captureMode'\);\n  var filmCol=.*?\n\}\)\(\);\n(?=function recommend)", re.S)
          s, n = mode_pattern.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'duplicate capture-mode wiring: expected 1, found {n}')

          # 10) Remove an extra ISO change recalc handler in initApp (already wired elsewhere).
          replace_once(
              "  var isoSel=document.getElementById('isoSelect'); if(isoSel){ isoSel.addEventListener('change',recalc) }\n",
              "",
              'duplicate ISO recalc handler'
          )

          # 11) Correct About metadata and bump bug-fix version.
          s = s.replace('Version 4.0.8 — October 2025', 'Version 4.0.9 — September 2026')
          s = s.replace('https://github.com/andrewh/photo-exposure-app', 'https://github.com/andrewscookies-ops/Photography_App')
          s = s.replace("a.download='Photography_App_V2_custom_'+ts+'.html';", "a.download='Photography_App_custom_'+ts+'.html';")

          path.write_text(s, encoding='utf-8')

      - name: Sanity checks
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'version bumped':'Version 4.0.9' in s,
            'copy button':'id="copyBtn"' in s,
            'share button':'id="shareBtn"' in s,
            'touch scroll blocker':"touchmove', function(e){ if(e.cancelable) e.preventDefault();" in s,
            'persistent custom gear':"photoAppUserGear_v2" in s,
            'broken all mode removed':'<option value="all">All built-ins</option>' not in s,
            'wrong repo fixed':'andrewh/photo-exposure-app' not in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Sanity checks failed: '+', '.join(bad))
          print('All sanity checks passed')

      - name: Commit hotfix and remove one-time workflow
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/photo-hotfix.yml
          git add index.html
          git commit -m "Photography App v4.0.9 usability hotfix"
          git push
