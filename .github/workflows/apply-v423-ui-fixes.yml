name: Apply Photography App v4.2.4 creative intent redesign

on:
  push:
    paths:
      - '.github/workflows/apply-v423-ui-fixes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign Creative Intent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          oldver='Version 4.2.3 — September 2026'
          newver='Version 4.2.4 — September 2026'
          if s.count(oldver)!=1:
              raise SystemExit('version anchor mismatch')
          s=s.replace(oldver,newver,1)

          css='''
  /* Creative Intent: compact, aligned discrete choices */
  .intent-stack{display:grid;gap:12px;margin-top:8px}
  .intent-row{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--chipBg)}
  .intent-row-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .intent-title{font-size:13px;font-weight:700;color:var(--text)}
  .intent-hint{font-size:11px;color:var(--muted);text-align:right}
  .intent-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  #creativeCard .intent-strip .seg-btn{min-width:0;width:100%;padding:9px 4px;font-size:12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);line-height:1.15}
  #creativeCard .intent-strip .seg-btn:hover{background:var(--rowHover)}
  #creativeCard .intent-strip .seg-btn.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);box-shadow:none}
  .creative-toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .creative-toggle-pill{display:flex;align-items:center;justify-content:center;gap:7px;margin:0;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:12px;cursor:pointer}
  .creative-toggle-pill input{width:auto;margin:0;padding:0}
  #ciSummary{margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
  @media(max-width:600px){
    .intent-row{padding:8px}
    .intent-row-head{display:block;margin-bottom:7px}
    .intent-hint{display:block;text-align:left;margin-top:2px}
    #creativeCard .intent-strip .seg-btn{font-size:11px;padding:9px 2px}
  }
'''
          anchor='  /* Range slider base */'
          if anchor not in s:
              raise SystemExit('css anchor missing')
          s=s.replace(anchor,css+'\n'+anchor,1)

          pattern=re.compile(r'''  <button id="creativeToggle".*?</button>\s*<div class="card" id="creativeCard".*?<div class="sub" id="ciSummary".*?</div>\s*</div>''',re.S)
          replacement='''  <button id="creativeToggle" aria-expanded="true" style="margin-bottom:8px;">Hide Creative Intent</button>
  <div class="card" id="creativeCard">
    <div class="section-header">Creative Intent</div>
    <div class="sub">Tell the app what you want the photograph to look like.</div>

    <div class="intent-stack">
      <div class="intent-row">
        <div class="intent-row-head">
          <span class="intent-title">Depth of field</span>
          <span class="intent-hint">More in focus ↔ Softer background</span>
        </div>
        <div class="intent-strip" id="ciBlurSeg" role="group" aria-label="Depth of field preference">
          <button type="button" class="seg-btn" data-val="vdeep">Very deep</button>
          <button type="button" class="seg-btn" data-val="deep">Deep</button>
          <button type="button" class="seg-btn active" data-val="balanced">Balanced</button>
          <button type="button" class="seg-btn" data-val="shallow">Shallow</button>
          <button type="button" class="seg-btn" data-val="vshallow">Very shallow</button>
        </div>
      </div>

      <div class="intent-row">
        <div class="intent-row-head">
          <span class="intent-title">Motion</span>
          <span class="intent-hint">Show movement ↔ Freeze movement</span>
        </div>
        <div class="intent-strip" id="ciMoveSeg" role="group" aria-label="Motion preference">
          <button type="button" class="seg-btn" data-val="blur">Blurred</button>
          <button type="button" class="seg-btn" data-val="slow">Slight blur</button>
          <button type="button" class="seg-btn active" data-val="balanced">Natural</button>
          <button type="button" class="seg-btn" data-val="fast">Sharp</button>
          <button type="button" class="seg-btn" data-val="freeze">Frozen</button>
        </div>
      </div>

      <div class="intent-row">
        <div class="intent-row-head">
          <span id="grainLabel" class="intent-title">Grain preference</span>
          <span class="intent-hint">Cleaner ↔ More texture</span>
        </div>
        <div class="intent-strip" id="ciGrainSeg" role="group" aria-label="Grain or noise preference">
          <button type="button" class="seg-btn" data-val="clean">Clean</button>
          <button type="button" class="seg-btn" data-val="low">Low</button>
          <button type="button" class="seg-btn active" data-val="balanced">Balanced</button>
          <button type="button" class="seg-btn" data-val="high">High</button>
          <button type="button" class="seg-btn" data-val="gritty">Gritty</button>
        </div>
      </div>
    </div>

    <div class="creative-toggles">
      <label class="creative-toggle-pill">Tripod <input type="checkbox" id="ciTripod2"></label>
      <label class="creative-toggle-pill">Panning <input type="checkbox" id="ciPanning2"></label>
    </div>
    <div class="sub" id="ciSummary">Balanced DOF • Neutral motion • Balanced grain/noise</div>
  </div>'''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit(f'creative markup matches: {n}')

          old='''    wrap.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        wrap.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        updateCISummary();
        recalc();
      });
    });'''
          new='''    wrap.querySelectorAll('.seg-btn').forEach(function(btn){
      btn.setAttribute('aria-pressed',btn.classList.contains('active')?'true':'false');
      btn.addEventListener('click',function(){
        wrap.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
        this.classList.add('active');
        this.setAttribute('aria-pressed','true');
        updateCISummary();
        recalc();
      });
    });'''
          if s.count(old)!=1:
              raise SystemExit('bindSeg anchor mismatch')
          s=s.replace(old,new,1)

          p.write_text(s)
          print('Creative Intent redesign applied')
          PY
          git diff --check
          grep -q 'Version 4.2.4' index.html
          grep -q 'intent-strip' index.html
          grep -q 'Hide Creative Intent' index.html
      - name: Commit v4.2.4
        shell: bash
        run: |
          git config user.name 'Photography App Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Photography App v4.2.4 refine creative intent workflow'
          git push
