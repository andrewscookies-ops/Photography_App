name: Apply Photography App v4.2.3 UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v423-ui-fixes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v423.py
          python3 /tmp/patch_v423.py
          git diff --check
          grep -q 'Version 4.2.3' index.html
          grep -q 'focalValueForLens' index.html
      - name: Commit v4.2.3
        shell: bash
        run: |
          git config user.name 'Photography App Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Photography App v4.2.3 fix numeric input UI glitches'
          git push
