name: Apply Photography App v4.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v421.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.2.1 accuracy polish
        run: python3 scripts/apply_v421.py
      - name: Commit v4.2.1
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/apply-v421.yml
          rm -f scripts/apply_v421.py
          git add -A
          git commit -m "Photography App v4.2.1 polish metering accuracy"
          git push
