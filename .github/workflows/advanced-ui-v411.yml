name: Advanced UI v4.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/advanced-ui-v411.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Advanced UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Replace the existing advanced-summary styling with a compact, touch-friendly treatment.
          css_pat=re.compile(r'/\* Highlight expandable section headers on hover \*/.*?\.info-inline\{margin:4px 0 6px 0;font-size:12px;color:var\(--muted\);font-style:italic;min-height:1em\}', re.S)
          css_new=r'''/* Advanced tools: compact, obvious, touch-friendly */
  #advancedDrawer details{border-top:1px solid var(--border);margin:0}
  #advancedDrawer details:last-child{border-bottom:1px solid var(--border)}
  #advancedDrawer details > summary{
    list-style:none; display:flex; align-items:center; gap:10px;
    cursor:pointer; padding:13px 4px; border-radius:8px; min-height:48px;
    user-select:none; -webkit-user-select:none;
  }
  #advancedDrawer details > summary::-webkit-details-marker{display:none}
  #advancedDrawer details > summary::marker{display:none}
  #advancedDrawer details > summary:hover{background:var(--rowHover)}
  .adv-chevron{
    flex:0 0 18px; width:18px; height:18px; display:inline-flex;
    align-items:center; justify-content:center; color:var(--muted);
    font-size:20px; line-height:1; transform:rotate(0deg);
    transition:transform .15s ease;
  }
  details[open] > summary .adv-chevron{transform:rotate(90deg)}
  .summary-label{flex:1 1 auto;font-weight:600}
  button.info-btn{width:26px !important;height:26px !important;padding:0 !important}
  .info-btn{
    flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; font-size:13px; font-weight:700; line-height:1;
    background:var(--btn-bg); color:var(--text); border:1px solid var(--border);
  }
  .info-btn:hover{background:var(--btn-bg-hover);border-color:var(--accent)}
  .info-inline{
    margin:0 6px 10px 28px; font-size:13px; line-height:1.45;
    color:var(--muted); min-height:0;
  }
  .advanced-intro{margin:0 0 8px 0;line-height:1.45}'''
          s,n=css_pat.subn(css_new,s,count=1)
          if n!=1:
              raise SystemExit(f'Advanced CSS replacement failed: {n}')

          old_pat=re.compile(r'''  <button id="advancedToggle">Open Advanced</button>\n  <div class="card" id="advancedDrawer" style="display:none;">.*?\n  </div>\n</div>\n<!-- Calibrate Modal -->''',re.S)
          new_block=r'''  <button id="advancedToggle">Open Advanced</button>
  <div class="card" id="advancedDrawer" style="display:none;">
    <div class="section-header">Advanced</div>
    <div class="sub advanced-intro">Optional tools for specific situations. Tap a row to open it. Tap ? for a quick explanation.</div>

    <details>
      <summary>
        <span class="adv-chevron" aria-hidden="true">›</span>
        <span class="summary-label">Depth of Field</span>
        <button type="button" class="info-btn" data-info="dof" aria-label="What is depth of field?">?</button>
      </summary>
      <div class="info-inline" data-info-desc="dof"></div>
      <div id="dofOut">—</div>
    </details>

    <details>
      <summary>
        <span class="adv-chevron" aria-hidden="true">›</span>
        <span class="summary-label">Motion &amp; Panning</span>
        <button type="button" class="info-btn" data-info="motion" aria-label="What are motion and panning settings?">?</button>
      </summary>
      <div class="info-inline" data-info-desc="motion"></div>
      <div id="motOut">—</div>
    </details>

    <details>
      <summary>
        <span class="adv-chevron" aria-hidden="true">›</span>
        <span class="summary-label">Bracketing</span>
        <button type="button" class="info-btn" data-info="bracket" aria-label="What is bracketing?">?</button>
      </summary>
      <div class="info-inline" data-info-desc="bracket"></div>
      <div id="brOut">—</div>
    </details>

    <details>
      <summary>
        <span class="adv-chevron" aria-hidden="true">›</span>
        <span class="summary-label">Long Exposure (Reciprocity)</span>
        <button type="button" class="info-btn" data-info="reciprocity" aria-label="What is reciprocity correction?">?</button>
      </summary>
      <div class="info-inline" data-info-desc="reciprocity"></div>
      <div id="recipOut">—</div>
    </details>

    <details>
      <summary>
        <span class="adv-chevron" aria-hidden="true">›</span>
        <span class="summary-label">Push / Pull Film</span>
        <button type="button" class="info-btn" data-info="pushpull" aria-label="What is push or pull film processing?">?</button>
      </summary>
      <div class="info-inline" data-info-desc="pushpull"></div>
      <div id="ppOut">—</div>
    </details>
  </div>
</div>
<!-- Calibrate Modal -->'''
          s,n=old_pat.subn(new_block,s,count=1)
          if n!=1:
              raise SystemExit(f'Advanced HTML replacement failed: {n}')

          # Add concise, practical explanations for the restored question-mark buttons.
          anchor='function wireInfoButtons(){'
          if anchor not in s:
              raise SystemExit('wireInfoButtons anchor missing')
          info=r'''window.INFO={
  dof:'Shows how much of the scene will look acceptably sharp in front of and behind your focus point.',
  motion:'Helps you see whether your shutter speed will freeze movement, show blur, or work for a panning shot.',
  bracket:'Shows a short series of exposures above and below the recommended setting when you want extra insurance.',
  reciprocity:'For long film exposures, some films need more time than the meter suggests. This shows the corrected exposure.',
  pushpull:'Shows how rating film above or below box speed changes the processing you should request from the lab.'
};

'''
          s=s.replace(anchor,info+anchor,1)

          # Version bump.
          if 'Version 4.1.0 — September 2026' in s:
              s=s.replace('Version 4.1.0 — September 2026','Version 4.1.1 — September 2026',1)
          elif 'Version 4.1.1 — September 2026' not in s:
              raise SystemExit('Expected v4.1.0 version string not found')

          # Sanity checks.
          checks=[
              'class="adv-chevron"',
              'data-info="dof"',
              'data-info="motion"',
              'data-info="bracket"',
              'data-info="reciprocity"',
              'data-info="pushpull"',
              'window.INFO={',
              'Version 4.1.1 — September 2026'
          ]
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('Missing expected Advanced UI pieces: '+repr(missing))
          if 'id="exposureTriangle"' in s:
              raise SystemExit('Old static exposure triangle still present')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v4.1.1
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/advanced-ui-v411.yml
          git add index.html
          git commit -m "Photography App v4.1.1 simplify Advanced tools"
          git push
