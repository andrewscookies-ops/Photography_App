name: Apply Photography App v4.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v422.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable live recommendation updates while dragging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""  function scheduleDragRecalc(){\n    if(dragRecalcTimer!==null) return;\n    dragRecalcTimer=setTimeout(function(){\n      dragRecalcTimer=null;\n      try{ recalc(); }catch(_e){}\n      if(dragging){ scheduleDragRecalc(); }\n    }, 80);\n  }"""
          new="""  function scheduleDragRecalc(){\n    if(dragRecalcTimer!==null) return;\n    dragRecalcTimer=setTimeout(function(){\n      dragRecalcTimer=null;\n      try{ recalc(); }catch(_e){}\n      if(dragging){ scheduleDragRecalc(); }\n    }, 40);\n  }"""
          if old not in s:
              raise SystemExit('drag recalc scheduler block not found')
          s=s.replace(old,new,1)

          old_drag="""    if(source==='drag'){\n      // Drag stays visually immediate; full exposure recalculation happens on release.\n    }else if(source==='kb'){"""
          new_drag="""    if(source==='drag'){\n      // Keep the thumb/description immediate, while recommendations refresh during the drag.\n      scheduleDragRecalc();\n    }else if(source==='kb'){"""
          if old_drag not in s:
              raise SystemExit('drag source block not found')
          s=s.replace(old_drag,new_drag,1)

          if 'Version 4.2.1 — September 2026' not in s:
              raise SystemExit('v4.2.1 version string not found')
          s=s.replace('Version 4.2.1 — September 2026','Version 4.2.2 — September 2026',1)

          if "scheduleDragRecalc();\n    }else if(source==='kb')" not in s:
              raise SystemExit('live drag recalc sanity check failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v4.2.2
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-v422.yml
          git add index.html
          git commit -m "Photography App v4.2.2 update recommendations while sliding"
          git push
