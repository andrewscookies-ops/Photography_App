name: Apply Photography App v4.4.6

on:
  push:
    paths:
      - ".github/workflows/apply-v446.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.4.6
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('Version 4.4.5 — September 2026','Version 4.4.6 — September 2026'),
            ('more-tools-v445.css?v=445','more-tools-v445.css?v=446'),
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected marker: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit v4.4.6
        run: |
          git config user.name "Photography App Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Photography App v4.4.6 lock incident dial gesture"
          git push